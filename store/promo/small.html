<!doctype html>
<html lang="en">
<head>

<title>SBC Start promo tile 440x280</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<style>
html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; background: #0c0619; }

img { width: 76px; height: 76px; filter: drop-shadow(0 8px 24px rgba(0, 152, 234, .5)); }
h1 { margin: 4px 0 0; font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
p { margin: 0; font-size: 17px; font-weight: 500; color: rgba(255, 255, 255, .88); }
</style>
</head>
<body>
<div class="tile">
  <img src="../../src/assets/sbc-logo.svg" alt="">
  <h1>SBC Start</h1>
  <p>Your new tab, upgraded</p>

</html>
