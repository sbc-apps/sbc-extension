name: Deploy landing to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site/**'
      - 'src/assets/**'
      - 'src/brand-icons.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  # Upload and deploy run as separate jobs (GitHub's starter layout). In one job the deploy step
  # can query for the artifact before GitHub has registered it and fail with
  # "No artifacts named github-pages were found"; the job boundary removes that race.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The landing page is static (index.html + site/) and is served exactly as it sits in the
      # repository, so the result is identical whether Pages uses this workflow or branch publishing.
      - name: Collect the static landing site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages/src/assets/wallpapers
          cp index.html pages/index.html
          cp -R site pages/site
          cp src/brand-icons.js pages/src/brand-icons.js
          cp src/assets/sbc-logo.svg pages/src/assets/sbc-logo.svg
          cp src/assets/wallpapers/aurora.svg pages/src/assets/wallpapers/aurora.svg
          touch pages/.nojekyll
          test -s pages/site/landing.js
          ls pages/site/previews/fa/*.jpg pages/site/previews/en/*.jpg >/dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
