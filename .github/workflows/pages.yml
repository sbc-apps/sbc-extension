name: Deploy landing to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'landing.html'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Prepare standalone landing website
        shell: bash
        run: |
          mkdir -p pages
          cp dist/landing.html pages/index.html
          cp -R dist/assets pages/assets
          touch pages/.nojekyll
          test -s pages/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
