name: Build and release SBC Start
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'manifest.json'
      - 'src/**'
      - 'site/landing.js'
      - 'newtab.html'
      - 'vite.config.js'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and decide whether to release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          test "$VERSION" = "$MANIFEST_VERSION" || { echo 'package.json and manifest.json versions must match'; exit 1; }
          LANDING_VERSION=$(sed -n "s/^export const VERSION = '\([^']*\)'.*/\1/p" site/landing.js)
          test "$VERSION" = "$LANDING_VERSION" || { echo "site/landing.js VERSION ($LANDING_VERSION) must match package.json ($VERSION)"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PREVIOUS=$(git show HEAD^:package.json 2>/dev/null | node -e "let s='';process.stdin.on('data',v=>s+=v).on('end',()=>{try{process.stdout.write(JSON.parse(s).version)}catch{}})" || true)
          if [ "$VERSION" != "$PREVIOUS" ] || ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then echo 'changed=true' >> "$GITHUB_OUTPUT"; else echo 'changed=false' >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build extension
        run: npm run build
      - name: Verify extension new-tab output
        run: test -s dist/newtab.html
      - name: Prepare Chromium and Firefox packages
        run: |
          set -euo pipefail
          cp -R dist pkg-chromium
          cp -R dist pkg-firefox
          cp manifest.json pkg-firefox/manifest.json
          # The Chrome Web Store flags Firefox-only manifest keys, so the Chromium package omits them.
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));delete m.browser_specific_settings;fs.writeFileSync('pkg-chromium/manifest.json',JSON.stringify(m,null,2)+'\\n')"
      - name: Package Chromium and Firefox
        run: |
          (cd pkg-chromium && zip -qr "../sbc-start-v${{ steps.version.outputs.version }}-chromium.zip" .)
          (cd pkg-firefox && zip -qr "../sbc-start-v${{ steps.version.outputs.version }}-firefox.zip" .)
          # Stable names so the landing page can link to releases/latest/download/<name>.
          cp "sbc-start-v${{ steps.version.outputs.version }}-chromium.zip" sbc-start-chromium.zip
          cp "sbc-start-v${{ steps.version.outputs.version }}-firefox.zip" sbc-start-firefox.zip
      - name: Publish GitHub Release (only when version changes)
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"; exit 0
          fi
          gh release create "v$VERSION" "sbc-start-v$VERSION-chromium.zip" "sbc-start-v$VERSION-firefox.zip" sbc-start-chromium.zip sbc-start-firefox.zip --title "SBC Start v$VERSION" --generate-notes --latest
      - name: Upload build artifact for non-version changes
        if: steps.version.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sbc-start-preview
          path: pkg-chromium/
