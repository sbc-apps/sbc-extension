<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SBC Start: everything in a new tab</title>
<meta name="description" content="SBC Start is a free new tab extension with live crypto prices, SBC news, weather, a Jalali calendar, tasks and a focus timer.">
<meta name="theme-color" content="#0c0619">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="SBC Start">
<meta property="og:description" content="Follow crypto prices, news and your tasks in every new tab.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="src/assets/sbc-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="site/landing.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<button class="lang-toggle" type="button" id="lang-toggle" lang="fa">فارسی</button>

<main class="hero">
  <div class="brand">
    <img class="logo" src="src/assets/sbc-logo.svg" alt="SBC" width="96" height="96">
    <h1 data-i18n="title">SBC Start</h1>
  </div>

  <p class="statement">
    <span class="words" id="words" aria-hidden="true"></span>
    <span class="sr-only" id="words-sr" data-i18n="wordsSr">crypto prices, today's news, your tasks and the weather</span>
    <span data-i18n="statementTail">in every new tab</span>
  </p>

  <div class="downloads" role="group" data-i18n-aria="downloadGroup" aria-label="Download for your browser">
    <div class="dl-menu">
      <button class="dl-box" type="button" data-browser="chrome"><span class="glyph" data-glyph="chrome"></span><span class="sr-only">Chrome</span></button>
      <button class="dl-more" type="button" id="dl-more" aria-expanded="false" aria-controls="dl-dropdown" data-i18n-aria="otherBrowsers" aria-label="Other browsers">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="dl-dropdown" id="dl-dropdown" hidden>
        <button type="button" data-browser="opera"><span class="glyph" data-glyph="opera"></span>Opera</button>
        <button type="button" data-browser="vivaldi"><span class="glyph" data-glyph="vivaldi"></span>Vivaldi</button>
        <button type="button" data-browser="chromium"><span class="glyph" data-glyph="chrome"></span><span data-i18n="otherChromium">Other Chromium browsers</span></button>
      </div>
    </div>
    <button class="dl-box" type="button" data-browser="brave"><span class="glyph" data-glyph="brave"></span><span class="sr-only">Brave</span></button>
    <button class="dl-box" type="button" data-browser="edge"><span class="glyph" data-glyph="edge"></span><span class="sr-only">Edge</span></button>
    <button class="dl-box" type="button" data-browser="firefox"><span class="glyph" data-glyph="firefox"></span><span class="sr-only">Firefox</span></button>
  </div>

  <div class="info">
    <div class="info-box"><b class="ltr" id="version">1.5.0</b><span data-i18n="version">Version</span></div>
    <div class="info-box"><b data-i18n="toolsCount">12+</b><span data-i18n="tools">Handy tools</span></div>
    <div class="info-box"><b data-i18n="free">Free</b><span data-i18n="noSignup">No sign-up</span></div>
  </div>

  <div class="features">
    <button class="feature" type="button" data-feature="weather">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
      <span data-i18n="f.weather">Weather</span>
    </button>
    <button class="feature" type="button" data-feature="news">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span data-i18n="f.news">News</span>
    </button>
    <button class="feature" type="button" data-feature="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
      <span data-i18n="f.calendar">Calendar</span>
    </button>
    <button class="feature" type="button" data-feature="tasks">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8M13 12h8M13 18h8"/></svg>
      <span data-i18n="f.tasks">My tasks</span>
    </button>
    <button class="feature" type="button" data-feature="prices">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
      <span data-i18n="f.prices">Prices</span>
    </button>
    <button class="feature" type="button" data-feature="timer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22h14M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg>
      <span data-i18n="f.timer">Timer</span>
    </button>
    <button class="feature" type="button" data-feature="clock">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span data-i18n="f.clock">Clock</span>
    </button>
    <button class="feature" type="button" data-feature="converter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
      <span data-i18n="f.converter">Converter</span>
    </button>
  </div>
</main>

<footer class="foot">
  <span class="foot-brand" data-i18n="company">SBC · Senior Block Chain</span>
  <nav class="foot-links">
    <a href="https://sbc.om/about/" target="_blank" rel="noopener noreferrer" data-i18n="about">About</a>
    <a href="https://sbc.om/contact/" target="_blank" rel="noopener noreferrer" data-i18n="contact">Contact</a>
    <button type="button" id="privacy-link" data-i18n="privacy">Privacy</button>
    <a href="https://github.com/sbc-apps/sbc-extension" target="_blank" rel="noopener noreferrer" data-i18n="github">GitHub</a>
  </nav>
</footer>

<dialog class="modal" id="feature-modal" aria-labelledby="feature-title">
  <button class="modal-close" type="button" data-close data-i18n-aria="close" aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  <div class="modal-text">
    <h2 id="feature-title"></h2>
    <p id="feature-desc"></p>
  </div>
  <div class="modal-preview"><img id="feature-img" alt="" width="600" height="340"></div>
</dialog>

<dialog class="modal" id="install-modal" aria-labelledby="install-title">
  <button class="modal-close" type="button" data-close data-i18n-aria="close" aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  <div class="modal-text">
    <span class="install-glyph glyph" id="install-glyph"></span>
    <h2 id="install-title"></h2>
    <p id="install-lead"></p>
  </div>
  <ol class="steps" id="install-steps"></ol>
  <div class="modal-actions">
    <a class="btn-primary" id="install-download" href="https://github.com/sbc-apps/sbc-extension/releases/latest">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15V3m0 12-4-4m4 4 4-4M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="downloadZip">Download the extension</span>
    </a>
    <a class="btn-ghost" href="https://github.com/sbc-apps/sbc-extension/releases/latest" target="_blank" rel="noopener noreferrer" data-i18n="allReleases">All releases</a>
  </div>
</dialog>

<dialog class="modal" id="privacy-modal" aria-labelledby="privacy-title">
  <button class="modal-close" type="button" data-close data-i18n-aria="close" aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  <div class="modal-text">
    <h2 id="privacy-title" data-i18n="privacy">Privacy</h2>
  </div>
  <ul class="privacy-list" id="privacy-list"></ul>
</dialog>

<script type="module" src="site/landing.js"></script>
</body>
</html>
